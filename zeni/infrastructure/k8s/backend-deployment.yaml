apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeni-api
  namespace: zeni
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zeni-api
  template:
    metadata:
      labels:
        app: zeni-api
    spec:
      containers:
        - name: api
          image: zeni/api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: zeni-config
            - secretRef:
                name: zeni-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zeni-api
  namespace: zeni
spec:
  selector:
    app: zeni-api
  ports:
    - port: 80
      targetPort: 8080
